name: Release

permissions:
  contents: write # Required to upload assets to the GitHub Release

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: x86_64 gpu
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ github.event.release.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 lowdown

      - name: Compile
        run: make CXX=g++-14 CXXFLAGS=-march=x86-64-v2 STRIP=true GPU_SUPPORT=true BUILD_TYPE=Release

      - name: Package
        run: |
          ARCHIVE="btop-x86_64-linux-gnu-${VERSION}"
          STAGE="/tmp/stage"
          mkdir -p "$STAGE/bin" "$STAGE/share/btop"
          cp bin/btop "$STAGE/bin/btop"
          cp -r themes "$STAGE/share/btop/themes"
          if [ -f btop.1 ]; then
            mkdir -p "$STAGE/share/man/man1"
            cp btop.1 "$STAGE/share/man/man1/"
          fi
          tar -czf "${ARCHIVE}.tar.gz" -C "$STAGE" .
          sha256sum "${ARCHIVE}.tar.gz" > "${ARCHIVE}.tar.gz.sha256"
          ls -lh "${ARCHIVE}.tar.gz"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$VERSION" btop-x86_64-linux-gnu-${VERSION}.tar.gz btop-x86_64-linux-gnu-${VERSION}.tar.gz.sha256 --clobber
