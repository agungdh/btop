name: Release

permissions:
  contents: write # Required to upload assets to the GitHub Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      web_version:
        description: 'btop-web release tag to bundle (e.g. v0.0.2)'
        required: false
        default: 'v0.0.2'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    name: unit + smoke tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 curl

      - name: Build and run tests
        run: |
          cmake -S . -B build -DCMAKE_CXX_COMPILER=g++-14 -DBUILD_TESTING=ON -DBTOP_GPU=ON
          cmake --build build -j
          ctest --test-dir build --output-on-failure

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64 gpu
            os: ubuntu-22.04
            arch: x86_64
            march: x86-64-v2
            gpu: true
          - name: arm64
            os: ubuntu-22.04-arm
            arch: aarch64
            march: armv8-a
            gpu: false
    env:
      VERSION: ${{ github.event.release.tag_name || github.ref_name }}
      WEB_VERSION: ${{ github.event.inputs.web_version || 'v0.0.2' }}
      PKG_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y g++-14

      - name: Download btop-web build
        run: |
          ARCHIVE="btop-web-${WEB_VERSION}.tar.gz"
          curl -fsSL -o "$ARCHIVE" "https://github.com/agungdh/btop-web/releases/download/${WEB_VERSION}/${ARCHIVE}"
          mkdir -p web
          tar -xzf "$ARCHIVE" -C web
          test -f web/index.html
          echo "btop-web ${WEB_VERSION} extracted"

      - name: Compile
        run: >
          make CXX=g++-14
          CXXFLAGS="-march=${{ matrix.march }} -static-libstdc++ -static-libgcc"
          LDFLAGS="-static-libstdc++ -static-libgcc"
          STRIP=true GPU_SUPPORT=${{ matrix.gpu }} BUILD_TYPE=Release WEBDIR=web

      - name: Package
        run: |
          ARCHIVE="btop-${PKG_ARCH}-linux-gnu-${VERSION}"
          STAGE="/tmp/stage"
          mkdir -p "$STAGE/bin" "$STAGE/share/btop"
          cp bin/btop "$STAGE/bin/btop"
          cp -r bin/web "$STAGE/bin/web"
          cp -r themes "$STAGE/share/btop/themes"
          if [ -f btop.1 ]; then
            mkdir -p "$STAGE/share/man/man1"
            cp btop.1 "$STAGE/share/man/man1/"
          fi
          tar -czf "${ARCHIVE}.tar.gz" -C "$STAGE" .
          sha256sum "${ARCHIVE}.tar.gz" > "${ARCHIVE}.tar.gz.sha256"
          ls -lh "${ARCHIVE}.tar.gz"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$VERSION" btop-${PKG_ARCH}-linux-gnu-${VERSION}.tar.gz btop-${PKG_ARCH}-linux-gnu-${VERSION}.tar.gz.sha256 --clobber
